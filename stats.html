<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>HeyVoyo · 几个数</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
/* 📊 几个数（2026-11-10，样板 样板/后台几个数样板.html）：只有管理员登录后看得到；数据来自 后台/pulse.sql 的 pulse_report() */
:root{--ink:#14305c;--ivory:#fbf7ee;--hot:#e2552f;--ok:#2f7d70;--soft:#6b7488;--line:#e6dfcf;--bar:#c9d3e3}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:#24303a;font:15px/1.55 -apple-system,"PingFang SC",sans-serif}button,input{font:inherit}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 60px}
.top{display:flex;align-items:center;gap:8px}.top b{font:900 22px "Noto Serif SC",serif;color:var(--ink)}.top small{margin-left:auto;color:var(--soft);font-size:12px}
.rng{display:flex;gap:6px;margin:12px 0 4px}.rng button{all:unset;cursor:pointer;padding:4px 12px;border-radius:99px;background:#fff;font-size:13px;color:var(--soft);border:1px solid var(--line)}.rng button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.big div{background:#fff;border-radius:14px;padding:10px 12px;border:1px solid var(--line)}.big b{display:block;font:900 30px/1.1 Georgia,serif;color:var(--ink)}.big span{font-size:13px;color:#3a4250}.big i{display:block;font-style:normal;font-size:11.5px;color:var(--soft);margin-top:2px}
h3{font:900 15px "Noto Serif SC",serif;color:var(--ink);margin:22px 0 8px}
.days{display:flex;align-items:flex-end;gap:4px;height:120px;background:#fff;border-radius:14px;padding:10px 10px 22px;border:1px solid var(--line)}
.days .d{flex:1;position:relative;height:100%;display:flex;align-items:flex-end}
.days .d .o{width:100%;background:var(--bar);border-radius:3px 3px 0 0;position:relative;min-height:1px}
.days .d .s{position:absolute;left:0;right:0;bottom:0;background:var(--ink);border-radius:3px 3px 0 0}
.days .d small{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--soft);white-space:nowrap}
.days .d em{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;color:var(--soft)}
.leg{font-size:12px;color:var(--soft);margin-top:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px -1px 8px}
.fun div{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13.5px}.fun span{width:96px;flex:none}.fun em{font-style:normal;height:20px;border-radius:4px;background:var(--ink);min-width:2px}.fun b{font-size:13px}.fun small{color:var(--hot);font-size:12px}
.ppl{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}.ppl .r{display:grid;grid-template-columns:1fr 54px 54px 54px;gap:4px;padding:8px 12px;border-top:1px solid var(--line);font-size:13px;align-items:center}.ppl .r:first-child{border-top:0;color:var(--soft);font-size:11.5px}
.ppl .r b{display:block;font-size:13.5px}.ppl .r i{font-style:normal;color:var(--soft);font-size:11.5px}.ppl .r span{text-align:center}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.foot,.empty{margin-top:14px;font-size:12.5px;color:var(--soft)}
.login{background:#fff;border-radius:16px;padding:18px;border:1px solid var(--line);margin-top:16px}.login input{display:block;width:100%;margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.login button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;margin-top:12px;background:var(--ink);color:#fff;border-radius:99px;padding:10px;font-weight:700}
.msg{color:var(--hot);font-size:13px;margin-top:8px}
</style></head><body><div class="wrap">
<div class="top"><b>试用的人怎么样</b><small id="upd"></small></div>
<div id="main"><p class="empty">正在打开……</p></div>
</div>
<script>
var HV_CONFIG = {"url": "https://pfqbskweyqyrmnrkioha.supabase.co", "anonKey": "sb_publishable_t7_0E-MFz55eQVI71X0MEA_UQ-sTb2Y"};
const $ = s => document.querySelector(s), esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const LV = ["打开", "点开活动", "说了一句", "做完这一步", "送给世界"], KEYS = ["open", "act", "say", "step", "send"];
let sb = null, R = null, range = 7;
function loadScript(src){ return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
async function start(){
  if (!HV_CONFIG || !HV_CONFIG.url){ $("#main").innerHTML = `<p class="empty">这一页要从 heyvoyo.com/stats.html 打开。</p>`; return; }
  if (!window.supabase) await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js");
  sb = window.supabase.createClient(HV_CONFIG.url, HV_CONFIG.anonKey, {auth: {persistSession: true}});
  const {data} = await sb.auth.getSession();
  if (!data.session) return loginForm();
  load();
}
function loginForm(msg){
  $("#main").innerHTML = `<div class="login"><b style="color:var(--ink)">用管理员的账号登录</b><p class="foot" style="margin-top:4px">在这台手机或电脑上登录过 HeyVoyo 的话，打开就直接看得到。</p>
    <input id="em" type="email" placeholder="邮箱" autocomplete="username"><input id="pw" type="password" placeholder="密码" autocomplete="current-password"><button id="go">登录</button><div class="msg">${esc(msg || "")}</div></div>`;
  $("#go").onclick = async () => { const r = await sb.auth.signInWithPassword({email: $("#em").value.trim(), password: $("#pw").value}); if (r.error) loginForm("没登录上：" + r.error.message); else load(); };
}
async function load(){
  $("#main").innerHTML = `<p class="empty">正在算……</p>`;
  const r = await sb.rpc("pulse_report", {p_days: range});
  if (r.error){ $("#main").innerHTML = /管理员/.test(r.error.message) ? `<p class="empty">这个账号不是管理员，看不了。<a href="#" id="out">换个账号</a></p>` : `<p class="empty">没拿到数：${esc(r.error.message)}</p>`;
    const o = $("#out"); if (o) o.onclick = async e => { e.preventDefault(); await sb.auth.signOut(); loginForm(); }; return; }
  R = r.data; $("#upd").textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN", {hour: "2-digit", minute: "2-digit"}); draw();
}
const md = s => { const p = String(s).split("-"); return (+p[1]) + "/" + (+p[2]); };
function draw(){
  const D = R.days || [], S = D, today = S[S.length - 1] || {}, sum = k => S.reduce((a, d) => a + (+d[k] || 0), 0);
  const since = R.since, P = R.people || [];
  const B = (R.back || []).filter(b => b.was > 0);
  const bw = B.reduce((a, b) => a + b.was, 0), bc = B.reduce((a, b) => a + b.came, 0), yb = (R.back || []).slice(-1)[0];
  const ppl = range === 1 ? (+today.open || 0) : P.length;
  let h = `<div class="rng" id="rng">${[[1, "今天"], [7, "这 7 天"], [30, "30 天"]].map(([n, t]) => `<button data-r="${n}" class="${n === range ? "on" : ""}">${t}</button>`).join("")}</div>
  <div class="big"><div><b>${ppl}</b><span>打开的人</span><i>${range === 1 ? "今天" : "每天平均 " + (sum("open") / S.length).toFixed(1) + " 个"}</i></div>
   <div><b>${range === 1 ? (+today.steps || 0) : sum("steps")}</b><span>次 做完今天这一步</span><i>${range === 1 ? (+today.step || 0) + " 个人" : "每天平均 " + (sum("steps") / S.length).toFixed(1)}</i></div>
   <div><b>${range === 1 ? (+today.sends || 0) : sum("sends")}</b><span>句 送给世界</span><i>${range === 1 ? (+today.send || 0) + " 个人" : P.filter(p => p.sends > 0).length + " 个人送过"}</i></div>
   <div><b>${range === 1 ? (yb && yb.was ? Math.round(yb.came / yb.was * 100) + "%" : "—") : bw ? Math.round(bc / bw * 100) + "%" : "—"}</b><span>第二天又来了</span><i>${range === 1 ? (yb && yb.was ? `昨天来的 ${yb.was} 个人里，今天来了 ${yb.came} 个` : "昨天还没有人来") : bw ? `前一天来过的，第二天又来的比例` : "还要再等等"}</i></div></div>`;
  if (range > 1){ const M = Math.max(1, ...S.map(d => +d.open || 0)), every = S.length > 14 ? 5 : S.length > 7 ? 3 : 1;
    h += `<h3>每天</h3><div class="days">${S.map((d, i) => `<div class="d"><div class="o" style="height:${(+d.open || 0) / M * 100}%">${d.open ? `<div class="s" style="height:${(+d.step || 0) / d.open * 100}%"></div>` : ""}</div>${d.open ? `<em>${d.open}</em>` : ""}<small>${(S.length - 1 - i) % every === 0 ? md(d.day) : ""}</small></div>`).join("")}</div>
    <div class="leg"><i style="background:var(--bar)"></i>打开的人<i style="background:var(--ink)"></i>做完今天这一步的人</div>`; }
  // 走到哪一步：这段时间里，至少走到这一格的人
  const F = KEYS.map((_, i) => range === 1 ? (+today[KEYS[i]] || 0) : P.filter(p => p.far >= i + 1).length);
  h += `<h3>大家走到哪一步就停了</h3><div class="fun">${F.map((n, i) => `<div><span>${LV[i]}</span><em style="width:${F[0] ? n / F[0] * 180 : 0}px"></em><b>${n}</b>${i && F[0] && F[i - 1] - n >= Math.max(1, F[0] * .2) ? `<small>少了 ${F[i - 1] - n} 个</small>` : ""}</div>`).join("")}</div>`;
  h += `<h3>每一个试用的人</h3>` + (P.length ? `<div class="ppl"><div class="r"><span style="text-align:left">谁 · 最远走到</span><span>来了几天</span><span>做完几步</span><span>送出几句</span></div>${P.map(p => {
      const nm = p.who === "u" ? (p.name || "登录了 · 没填名字") : "手机 · " + p.who.slice(2), tag = p.who === "u" ? "登录了" : "没登录";
      return `<div class="r"><div><b><span class="dot" style="background:${p.sends ? "var(--ok)" : p.steps ? "var(--ink)" : "#c9c2b0"}"></span>${esc(nm)}</b><i>${tag} · 最远走到「${LV[(p.far || 1) - 1]}」 · 最近 ${md(p.last)}</i></div><span>${p.days}</span><span>${p.steps}</span><span>${p.sends}</span></div>`; }).join("")}</div>` : `<p class="empty">这段时间还没有人来。</p>`);
  h += `<p class="foot">只记次数：打开、点开活动、说了一句、做完这一步、送给世界。不记说了什么、在哪儿。没登录的人只显示手机编号的后四位。这一页只有管理员看得到。<br><a href="#" id="out">退出登录</a></p>`;
  $("#main").innerHTML = h;
  $("#rng").onclick = e => { const b = e.target.closest("button"); if (b){ range = +b.dataset.r; load(); } };
  $("#out").onclick = async e => { e.preventDefault(); await sb.auth.signOut(); loginForm(); };
}
start();
</script></body></html>
